[versions]
tinkerpop = "3.8.1"
jena = "6.2.0"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.0"
sqlite = "3.53.4.0"
googleJavaFormat = "1.36.1"
jacoco = "0.8.15"
spotless = "8.10.1"
springBoot = "4.1.1"
springAi = "2.0.1"
jspecify = "1.0.1"

[libraries]
tinkergraph = { module = "org.apache.tinkerpop:tinkergraph-gremlin", version.ref = "tinkerpop" }
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jena" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-ai-starter-mcp-server = { module = "org.springframework.ai:spring-ai-starter-mcp-server" }
spring-ai-starter-mcp-server-webmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
