# FIX 9 of the increment-4a final review.
#
# Without this, every plain @SpringBootTest (ToolSurfaceTest, LoggingTargetsStderrTest) inherits
# the default segue.database path from src/main/resources/application.yaml —
# ${user.home}/.segue/segue.db — so `./gradlew check` creates ~/.segue/, opens the developer's real
# log, and replays whatever is in it. Test resources sit ahead of main resources on the test
# runtime classpath, so this overrides that one property for every test that does not set its own
# (SegueConfigurationTest already overrides it per-test via @DynamicPropertySource;
# StdioPurityTest launches a subprocess with its own -Dsegue.database — both take precedence over
# this file regardless).
#
# build/, not a TempDir: `./gradlew clean` removes it, and a fixed path is enough — nothing in the
# test suite reads a graph seeded by a previous run through this file.
segue:
  database: build/test-data/segue-test.db
