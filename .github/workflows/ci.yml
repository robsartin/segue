name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # WhatAHoverShowsTest renders DOT through the real binary to assert on what a browser
      # would show (ADR 41, issue #81). It skips itself where Graphviz is absent, and the
      # runner image does not carry it — so without this the one check standing between that
      # amendment and a silent regression passed by not running. That is the same failure the
      # issue is about, one level out.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # DeckBehaviourTest drives the real deck page in a real headless Chrome (issue #103): the
      # page is a hundred lines of async/await over fetch, and the only pure-Java browser that
      # would have needed no install, HtmlUnit, cannot parse or run it. The runner image usually
      # carries Chrome already; installing it when it does not is cheaper than finding out through
      # a skipped test.
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version

      - name: Check
        # Neither is a preference: with these set, a missing dependency fails the build instead of
        # skipping the only executable check on deck.html, or on what Graphviz writes into an SVG
        # and an imagemap. The installs above exist for those tests, and issue #164 is what happens
        # when one of them degrades — a green run that rendered nothing.
        env:
          SEGUE_REQUIRE_BROWSER: "true"
          SEGUE_REQUIRE_GRAPHVIZ: "true"
        run: ./gradlew --no-daemon check

      # build/reports/netlog/ carries the NetLog HeadlessChromeNetworkTest measured, on green runs
      # as well as red: its allowlist is per-platform, and without the log in this artifact the
      # runner's host set can only be read out of an assertion message (CI run 33655745937).
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/netlog/
          retention-days: 7
